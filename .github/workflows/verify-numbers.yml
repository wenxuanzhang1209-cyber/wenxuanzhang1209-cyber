name: Verify README numbers

# README 结尾写着「Every number above was measured, not estimated.」
# 这个 workflow 存在的意义，就是让那句话保持为真。
#
# 数字会自己过期：另一个仓库加了几个测试，这里的徽章就不对了，而这边
# 什么都不会发生 —— 徽章是图片，表格是纯文本。所以定期主动去量一次。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一早上 08:00（北京时间），一周一次足够：数字漂移是慢的
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  verify:
    name: Numbers are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-measure everything the README claims
        env:
          # 需要读其它仓库的 CI 日志来数测试数。默认的 GITHUB_TOKEN
          # 只对本仓库有权限，所以跨仓库那几项在这里会报「量不到」而
          # 不是失败 —— 脚本刻意区分了这两种情况：量不到不等于量错了。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_profile_numbers.py
